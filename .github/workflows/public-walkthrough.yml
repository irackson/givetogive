name: Encrypted public walkthrough capture
on:
    workflow_dispatch:
        inputs:
            expected_sha:
                description: Exact reviewed main commit
                type: string
                required: true
            public_key:
                description: Base64 DER SPKI RSA public encryption key (never private key)
                type: string
                required: true
permissions:
    contents: read
concurrency:
    group: encrypted-public-walkthrough
    cancel-in-progress: false
jobs:
    capture:
        if: >-
            github.repository == 'irackson/givetogive' && github.ref == 'refs/heads/main' &&
            github.actor == 'irackson' && github.triggering_actor == 'irackson' &&
            github.run_attempt == 1 && inputs.expected_sha == github.sha
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24.x
                  package-manager-cache: false
            - name: Locked install without lifecycle scripts
              run: npm ci --ignore-scripts --include=dev
            - name: Install locked browser
              run: npx --no-install playwright install --with-deps chromium
            - name: Read-only anonymous capture and encryption
              env:
                  CAPTURE_EXPECTED_SHA: ${{ inputs.expected_sha }}
                  CAPTURE_PUBLIC_KEY: ${{ inputs.public_key }}
              run: node scripts/capture-public-hosted.mjs --capture-encrypted-readonly
            - name: Upload ciphertext only (never raw capture directory)
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, verified upstream tag; native Node 24
              with:
                  name: encrypted-public-walkthrough
                  path: tmp/public-walkthrough.encrypted.json
                  if-no-files-found: error
                  retention-days: 1
                  compression-level: 0
