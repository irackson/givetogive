name: Read-only verification

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: read-only-verification-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        if: github.repository == 'irackson/givetogive' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        # Deliberately no secrets, staging accounts, database access or provider keys.
        env:
            APP_ENV: test
            NODE_ENV: production
            APP_URL: https://verification.example.invalid
            DATABASE_DATABASE: verification
            DATABASE_USER: verification
            DATABASE_PASSWORD: public-placeholder-not-a-secret
            DATABASE_HOST: 127.0.0.1
            DATABASE_URL: postgres://verification:public-placeholder-not-a-secret@127.0.0.1:1/verification
            NEXTAUTH_URL: https://verification.example.invalid
            NEXTAUTH_SECRET: public-offline-verification-placeholder-only
            DISCORD_CLIENT_ID: public-offline-placeholder
            DISCORD_CLIENT_SECRET: public-offline-placeholder
            PAYMENTS_ENABLED: 'false'
            SUPPORTERS_ENABLED: 'false'
            FUNDS_ENABLED: 'false'
            STRIPE_LIVE_APPROVED: 'false'
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; same reviewed pin as guarded staging
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6; same reviewed pin as guarded staging
              with:
                  node-version: 24.x
                  package-manager-cache: false
            - name: Locked application install
              run: npm ci --ignore-scripts --include=dev
            - name: Application unit tests
              run: node --test --test-concurrency=1 tests/unit/*.test.ts
            - name: Application types with generated Next route definitions
              run: npm run typecheck
            - name: Locked simulation install
              working-directory: tools/simulation
              run: npm ci --ignore-scripts --include=dev
            - name: Offline simulation tests
              working-directory: tools/simulation
              run: node --test --test-concurrency=1 tests/*.test.ts
            - name: Simulation types
              working-directory: tools/simulation
              run: npm run typecheck
            - name: Install locked public-smoke browser
              run: npx --no-install playwright install --with-deps chromium
            - name: Published public browser smoke (no credentials or writes)
              run: node scripts/verify-published.mjs
