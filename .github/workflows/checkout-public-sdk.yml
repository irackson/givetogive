name: Public wallet SDK read-only execution
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  public-sdk:
    if: >-
      github.repository == 'irackson/givetogive' && github.ref == 'refs/heads/main' &&
      github.actor == 'irackson' && github.triggering_actor == 'irackson' &&
      github.run_attempt == 1 && inputs.expected_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Locked tools and browser install without credentials
        working-directory: tools/simulation
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Execute only public static SDKs without credentials or payment actions
        working-directory: tools/simulation
        env:
          PUBLIC_SDK_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node src/public-wallet-sdk-probe.ts --execute-public-readonly
