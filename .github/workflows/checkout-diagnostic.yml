name: Read-only Checkout transport diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      challenge_nonce:
        description: Nonsecret random challenge for this diagnostic
        required: true
        type: string
      challenge_proof:
        description: Nonsecret domain-separated HMAC response from the local transfer key
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: givetogive-staging-community
  cancel-in-progress: false
jobs:
  checkout-diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'irackson/givetogive' && github.actor == 'irackson' &&
      github.triggering_actor == 'irackson' && github.run_attempt == 1 &&
      inputs.expected_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Locked tools install without credentials
        working-directory: tools/simulation
        run: npm ci --ignore-scripts
      - name: Transfer key comparison and retained private metadata reads only
        working-directory: tools/simulation
        env:
          CHECKOUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          CHECKOUT_DIAGNOSTIC_NONCE: ${{ inputs.challenge_nonce }}
          CHECKOUT_DIAGNOSTIC_PROOF: ${{ inputs.challenge_proof }}
          CHECKOUT_BUNDLE_KEY: ${{ secrets.CHECKOUT_STAGING_BUNDLE_KEY }}
          CHECKOUT_GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types src/checkout-transport-diagnostic.ts --execute-readonly
